name: Build Standalone Server

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

jobs:
  build-server:
    name: Package Standalone Server
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Client
        run: npm run build

      - name: Bundle Server for Standalone Execution
        run: |
          mkdir -p dist-server
          npx esbuild apps/server/src/standalone.ts --bundle --platform=node --target=node20 --outfile=dist-server/spyverse-server.cjs
          cp -r dist dist-server/dist
          cp server.bat dist-server/server.bat

      - name: Upload Server Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spyverse-standalone-server
          path: dist-server
