name: Build Desktop Applications

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (NSIS Installer & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Client
        run: npm run build

      - name: Bundle Dedicated Server
        run: npm run build:server

      - name: Build Desktop Bundle
        run: npm run build -w @spyverse/desktop

      - name: Build Windows Application
        run: npx electron-builder --config apps/desktop/electron-builder.json --win --publish never

      - name: Normalize Windows release asset names
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist-electron\SPYVERSE.Setup.$version.exe"
          $portable = "dist-electron\SPYVERSE.$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Windows installer was not found: $installer"
          }
          if (-not (Test-Path $portable)) {
            throw "Windows portable build was not found: $portable"
          }
          Move-Item $installer "dist-electron\SPYVERSE-Setup-$version.exe"
          Copy-Item "dist-electron\SPYVERSE-Setup-$version.exe" "dist-electron\SPYVERSE Setup $version.exe"
          Move-Item $portable "dist-electron\SPYVERSE $version.exe"

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: spyverse-windows
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.blockmap
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage & DEB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Client
        run: npm run build

      - name: Build Desktop Bundle
        run: npm run build -w @spyverse/desktop

      - name: Build Linux Application
        run: npx electron-builder --config apps/desktop/electron-builder.json --linux --publish never

      - name: Upload Linux Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: spyverse-linux
          path: |
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/latest-linux.yml
            dist-electron/*.blockmap
          if-no-files-found: error

  build-android:
    if: startsWith(github.ref, 'refs/tags/')
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web client
        run: npm run build

      - name: Generate Android project
        run: npm run add -w @spyverse/mobile

      - name: Set Android app version
        run: npm run set:android-version

      - name: Apply Android permissions
        run: cp apps/mobile/overrides/AndroidManifest.xml apps/mobile/android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npm run sync -w @spyverse/mobile

      - name: Generate Android app icon from desktop icon
        run: npm run generate:android-icons

      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Prepare APK release asset
        run: |
          mkdir -p release-assets
          ANDROID_VERSION="$(node -p "require('./package.json').version")"
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            "release-assets/SPYVERSE-android-${ANDROID_VERSION}.apk"

      - name: Upload Android Release Asset
        uses: actions/upload-artifact@v4
        with:
          name: spyverse-android
          path: release-assets/*.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish multi-platform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-android]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "SPYVERSE $VERSION" --generate-notes
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
