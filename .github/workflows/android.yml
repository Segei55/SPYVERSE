name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android client APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web client
        run: npm run build

      - name: Generate Android project
        run: npm run add -w @spyverse/mobile

      - name: Set Android app version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
          if (!match) throw new Error(`Expected a stable semantic version, got ${version}`);
          const [, majorText, minorText, patchText] = match;
          const [major, minor, patch] = [majorText, minorText, patchText].map(Number);
          const versionCode = major * 1_000_000 + minor * 1_000 + patch;
          const gradleFile = 'apps/mobile/android/app/build.gradle';
          const gradle = fs.readFileSync(gradleFile, 'utf8')
            .replace(/versionCode\s+\d+/, `versionCode ${versionCode}`)
            .replace(/versionName\s+"[^"]+"/, `versionName "${version}"`);
          fs.writeFileSync(gradleFile, gradle);
          NODE

      - name: Apply Android permissions
        run: cp apps/mobile/overrides/AndroidManifest.xml apps/mobile/android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npm run sync -w @spyverse/mobile

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spyverse-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
